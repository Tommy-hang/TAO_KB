name: Validate and deploy TAO Knowledge
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Derive deployment paths
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          echo "SITE_URL=https://${owner}.github.io" >> "$GITHUB_ENV"
          if [ "${repo,,}" = "${owner,,}.github.io" ]; then
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/${repo}/" >> "$GITHUB_ENV"
          fi
          echo "ASTRO_TELEMETRY_DISABLED=1" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - run: npm run build
      - run: npm run test:site
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
